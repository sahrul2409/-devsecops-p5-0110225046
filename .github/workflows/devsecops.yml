name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build & Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Jalankan unit test + coverage
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80

  sast-scan:
    name: SAST Scan (Bandit) & Quality Gate
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install bandit==1.7.10

      - name: Jalankan Bandit (laporan JSON)
        run: bandit -r app main.py -f json -o bandit-report.json --exit-zero

      - name: Tampilkan ringkasan Bandit
        run: bandit -r app main.py -f txt --exit-zero

      - name: Upload laporan SAST
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

      - name: Quality Gate
        run: python scripts/quality_gate.py bandit-report.json
